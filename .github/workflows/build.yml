name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Unpack project
        run: unzip -q ./*.zip
      - name: Fill in latest versions
        working-directory: pulsestyle
        run: |
          MC=1.21.10
          YARN=$(curl -s https://meta.fabricmc.net/v2/versions/yarn/$MC | jq -r '.[0].version')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          API=$(curl -s "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          echo "yarn=$YARN loader=$LOADER api=$API"
          sed -i "s|^yarn_mappings=.*|yarn_mappings=$YARN|" gradle.properties
          sed -i "s|^loader_version=.*|loader_version=$LOADER|" gradle.properties
          sed -i "s|^fabric_version=.*|fabric_version=$API|" gradle.properties
      - name: Build
        working-directory: pulsestyle
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pulsestyle-mod
          path: |
            pulsestyle/build/libs/*.jar
            !pulsestyle/build/libs/*-sources.jar
